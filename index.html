<style>
  :root{ --gold:#e4c04c; --ink:#0b0b0b; --card:#16150f; --line:rgba(228,192,76,.28); --text:#f3ede0; --muted:#b9b1a2; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{background:var(--ink);}
  body{min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#24211a 0%,var(--ink) 55%);color:var(--text);
    font-family:'Arimo',Arial,sans-serif;display:flex;justify-content:center;
    padding:calc(28px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));}
  main{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;text-align:center;}
  .logo{width:min(300px,82%);mix-blend-mode:screen;margin-top:6px;}
  .tag{font-family:'Alice',Georgia,serif;font-size:21px;line-height:1.3;margin-top:14px;}
  .tag em{font-style:normal;color:var(--gold);}
  .city{font-size:12px;font-weight:700;letter-spacing:.14em;line-height:1.7;color:var(--gold);margin-top:10px;text-wrap:balance;}

  .links{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:26px;}
  .btn{display:flex;align-items:center;gap:14px;width:100%;padding:15px 18px;border-radius:16px;text-decoration:none;
    background:var(--card);border:1px solid var(--line);color:var(--text);text-align:left;
    transition:transform .15s ease,border-color .2s ease,background .2s ease;}
  .btn:hover{border-color:var(--gold);background:#1d1b14;}
  .btn:active{transform:scale(.98);}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
  .btn.primary{background:var(--gold);color:var(--ink);border-color:var(--gold);}
  .btn.primary:hover{background:#efcd5c;}
  .ic{width:44px;height:44px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(228,192,76,.12);color:var(--gold);}
  .btn.primary .ic{background:rgba(11,11,11,.12);color:var(--ink);}
  .ic svg{width:24px;height:24px;}
  .tx{flex:1;min-width:0;}
  .tx b{display:block;font-size:17px;font-weight:700;}
  .tx span{display:block;font-size:13px;margin-top:3px;opacity:.75;}
  .go{font-size:20px;opacity:.6;}

  .card{width:100%;margin-top:26px;border-radius:20px;overflow:hidden;background:var(--card);border:1px solid var(--line);}
  .card img{display:block;width:100%;height:auto;}
  .card .cap{padding:14px 18px 16px;text-align:left;}
  .card .cap small{font-size:11px;font-weight:700;letter-spacing:.24em;color:var(--gold);}
  .card .cap p{font-family:'Alice',Georgia,serif;font-size:22px;margin-top:4px;}
  .card .cap span{display:block;font-size:13px;color:var(--muted);margin-top:4px;}

  footer{margin-top:24px;font-size:12px;color:var(--muted);line-height:1.6;}
  footer b{color:var(--text);font-weight:700;}
</style>
</head>
